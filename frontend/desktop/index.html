<!DOCTYPE html>
<html class="dark" lang="es">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <meta content="web_dashboard" name="shell-type">
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#e3fdff",
            "primary-container": "#00f3ff",
            "primary-fixed": "#6ff6ff",
            "primary-fixed-dim": "#00dce6",
            "secondary": "#b3c5ff",
            "secondary-container": "#0266ff",
            "tertiary": "#fff6fd",
            "tertiary-container": "#f1d1ff",
            "error": "#ffb4ab",
            "surface": "#0f141a",
            "background": "#0f141a",
            "surface-container-lowest": "#0a0e15",
            "surface-container-low": "#181c23",
            "surface-container": "#1c2027",
            "surface-container-high": "#262a31",
            "surface-container-highest": "#31353c",
            "on-surface": "#dfe2ec",
            "on-surface-variant": "#b9cacb",
            "outline": "#849495",
            "outline-variant": "#3a494b",
            "on-primary": "#00373a",
            "on-secondary": "#002b75",
            "on-tertiary": "#4e0078",
            "on-error": "#690005"
          },
          fontFamily: {
            sans: ["Inter", "sans-serif"],
            mono: ["JetBrains Mono", "monospace"],
            display: ["Space Grotesk", "sans-serif"]
          }
        }
      }
    }
  </script>
  <title>JARVIS - Centro de Mando Global</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-background text-on-surface font-sans antialiased overflow-hidden h-screen w-screen">
  <div class="atmospheric-bg">
    <div class="orb-1"></div>
    <div class="orb-2"></div>
  </div>

  <div id="app" class="relative z-10 h-full w-full flex overflow-hidden">
    <!-- SIDEBAR: 12 DIVISIONES MAESTRAS -->
    <aside id="master-sidebar" class="w-20 lg:w-64 bg-surface-container-lowest border-r border-outline-variant flex flex-col transition-all duration-300">
      <div class="p-4 border-b border-outline-variant flex items-center justify-between">
        <div class="hidden lg:flex items-center gap-3">
          <span class="material-symbols-outlined text-primary-container animate-pulse">hub</span>
          <h1 class="font-display font-bold text-primary tracking-wider">JARVIS</h1>
        </div>
        <span class="material-symbols-outlined text-outline-variant cursor-pointer lg:hidden">menu</span>
      </div>

      <nav class="flex-1 overflow-y-auto p-2 space-y-1 custom-scrollbar">
        <div id="divisions-menu" class="space-y-1">
          <!-- Divisiones generadas por JS -->
        </div>
      </nav>

      <div class="p-4 border-t border-outline-variant text-center">
        <div class="hidden lg:block text-[10px] font-mono text-outline-variant uppercase mb-2">Status: Operational</div>
        <div class="w-full h-1 bg-outline-variant rounded-full overflow-hidden">
          <div class="h-full bg-primary-container w-3/4 animate-pulse"></div>
        </div>
      </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 flex flex-col relative overflow-hidden">
      <!-- TOP HEADER -->
      <header class="h-16 border-b border-outline-variant bg-surface-container-low/50 backdrop-blur-md flex items-center justify-between px-6">
        <div class="flex items-center gap-4">
          <span id="active-division-icon" class="material-symbols-outlined text-primary-container">shield</span>
          <h2 id="active-division-title" class="font-display font-semibold text-primary">Consola de Mando Global</h2>
        </div>
        <div class="flex items-center gap-6 font-mono text-xs">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
            <span class="text-on-surface-variant">CORE ONLINE</span>
          </div>
          <div id="global-clock" class="text-primary">00:00:00 UTC</div>
        </div>
      </header>

      <!-- DYNAMIC VIEWPORT -->
      <section id="viewport" class="flex-1 overflow-hidden p-4 relative">
        <div id="division-content" class="h-full w-full animate-slide-in">
           <!-- Default: Division 1 Content -->
        </div>
      </section>

      <!-- TACTICAL COMMAND BAR -->
      <footer class="h-20 border-t border-outline-variant bg-surface-container-lowest p-4 flex items-center gap-4">
        <div class="flex-1 relative">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline-variant">terminal</span>
          <input id="jarvis-command-input" type="text" placeholder="Ejecutar directiva táctica..." 
                 class="w-full bg-surface-container pl-10 pr-4 py-2 rounded-lg border border-outline-variant focus:border-primary-container outline-none font-mono text-sm transition-all">
        </div>
        <button id="btn-send-tactical" class="bg-primary-container text-on-primary px-6 py-2 rounded-lg font-bold text-xs uppercase tracking-widest hover:bg-primary-fixed transition-colors">
          Ejecutar
        </button>
      </footer>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
