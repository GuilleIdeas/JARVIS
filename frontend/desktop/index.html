<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS | Executive Command Center</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/standalone/umd/vis-network.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #020b14;
            --neon-blue: #00f2ff;
            --neon-cyan: #00d4ff;
            --neon-accent: #0066ff;
            --glass: rgba(0, 242, 255, 0.05);
            --border-glow: 0 0 10px rgba(0, 242, 255, 0.5);
            --text-color: #e0ffff;
        }
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            background-color: var(--bg-dark); color: var(--text-color);
            font-family: 'Rajdhani', sans-serif; overflow: hidden;
        }
        #app {
            display: grid; grid-template-columns: 280px 1fr 350px;
            height: 100vh; background: radial-gradient(circle at center, #0a1a2f 0%, #020b14 100%);
        }
        #sidebar {
            background: rgba(0, 0, 0, 0.6); border-right: 1px solid var(--neon-blue);
            display: flex; flex-direction: column; padding: 20px 0; box-shadow: var(--border-glow);
        }
        .logo {
            font-family: 'Orbitron', sans-serif; text-align: center; font-size: 1.5rem;
            color: var(--neon-blue); text-shadow: var(--border-glow); margin-bottom: 30px; letter-spacing: 3px;
        }
        .nav-item {
            padding: 12px 25px; cursor: pointer; transition: 0.3s; border-left: 3px solid transparent;
            font-weight: 500; text-transform: uppercase; font-size: 0.9rem; display: flex; align-items: center;
        }
        .nav-item:hover, .nav-item.active {
            background: var(--glass); color: var(--neon-blue); border-left: 3px solid var(--neon-blue); text-shadow: var(--border-glow);
        }
        #main-panel {
            display: flex; flex-direction: column; position: relative; padding: 20px; border-right: 1px solid rgba(0, 242, 255, 0.2);
        }
        .panel-header {
            font-family: 'Orbitron', sans-serif; font-size: 1.2rem; margin-bottom: 20px;
            color: var(--neon-blue); text-transform: uppercase; border-bottom: 1px solid var(--neon-blue); padding-bottom: 10px;
        }
        .module-container {
            flex-grow: 1; background: var(--glass); border: 1px solid rgba(0, 242, 255, 0.2);
            border-radius: 10px; position: relative; overflow: hidden; display: flex; flex-direction: column;
        }
        #graph-canvas { width: 100%; height: 100%; background: #000; }
        .sub-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .sub-tab { padding: 5px 15px; border: 1px solid var(--neon-blue); cursor: pointer; font-size: 0.8rem; border-radius: 5px; }
        .sub-tab.active { background: var(--neon-blue); color: #000; }
        #chat-console {
            display: flex; 
            flex-direction: column; 
            background: rgba(0, 0, 0, 0.8); 
            padding: 20px; 
            box-shadow: -10px 0 20px rgba(0,0,0,0.5);
            height: calc(100vh - 40px); 
            box-sizing: border-box;
        }
        #chat-history { 
            flex: 1 1 auto; 
            overflow-y: scroll !important; 
            margin-bottom: 20px; 
            padding-right: 10px;
            scrollbar-width: thin;
            scrollbar-color: var(--neon-blue) transparent;
            display: flex;
            flex-direction: column;
            min-height: 0; 
        }
        #chat-history::-webkit-scrollbar { width: 6px; }
        #chat-history::-webkit-scrollbar-track { background: transparent; }
        #chat-history::-webkit-scrollbar-thumb { background-color: var(--neon-blue); border-radius: 10px; }
        
        /* JARVIS AI VISUALIZATION */
        .jarvis-ai-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
            background: radial-gradient(circle at center, #0a1a2f 0%, transparent 70%);
            position: relative;
        }
        .ai-core {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .core-ring {
            position: absolute;
            border: 2px solid var(--neon-blue);
            border-radius: 50%;
            box-shadow: var(--border-glow), inset 0 0 15px var(--neon-blue);
            transition: all 0.5s ease;
        }
        .ring-1 {
            width: 100%; height: 100%;
            border-style: dashed;
            animation: rotate-clockwise 10s linear infinite;
            opacity: 0.6;
        }
        .ring-2 {
            width: 80%; height: 80%;
            border-width: 4px;
            border-style: double;
            animation: rotate-counter-clockwise 7s linear infinite;
            opacity: 0.8;
        }
        .ring-3 {
            width: 60%; height: 60%;
            border-style: dotted;
            animation: rotate-clockwise 5s linear infinite;
            opacity: 1;
        }
        .core-center {
            width: 40px;
            height: 40px;
            background: var(--neon-blue);
            border-radius: 50%;
            box-shadow: 0 0 30px var(--neon-blue), 0 0 60px var(--neon-blue);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes rotate-clockwise {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes rotate-counter-clockwise {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; box-shadow: 0 0 20px var(--neon-blue); }
            50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 50px var(--neon-blue); }
        }
        .ai-status-text {
            position: absolute;
            bottom: 40px;
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-blue);
            text-shadow: var(--border-glow);
            letter-spacing: 2px;
            animation: blink 1.5s step-end infinite;
        }
        @keyframes blink {
            from, to { opacity: 1; }
            50% { opacity: 0; }
        }


        #chat-history::-webkit-scrollbar { width: 6px; }
        #chat-history::-webkit-scrollbar-track { background: transparent; }
        #chat-history::-webkit-scrollbar-thumb { background-color: var(--neon-blue); border-radius: 10px; }
        
        .message { margin-bottom: 15px; padding: 10px; border-radius: 5px; font-size: 0.9rem; line-height: 1.4; max-width: 85%; }
        .user-msg { color: var(--neon-cyan); align-self: flex-end; text-align: right; border-right: 3px solid var(--neon-cyan); background: rgba(0, 212, 255, 0.05); }
        .jarvis-msg { color: var(--text-color); align-self: flex-start; border-left: 3px solid var(--neon-blue); background: rgba(0, 242, 255, 0.05); }
        .input-area { display: flex; gap: 10px; position: relative; }
        #user-input {
            flex-grow: 1; background: transparent; border: 1px solid var(--neon-blue);
            color: var(--text-color); padding: 12px; font-family: 'Rajdhani', sans-serif; border-radius: 5px; outline: none;
        }
        #mic-btn, #send-btn {
            background: transparent; border: 1px solid var(--neon-blue); color: var(--neon-blue);
            cursor: pointer; padding: 0 15px; border-radius: 5px; transition: 0.3s;
        }
        #send-btn:hover, #mic-btn:hover { background: var(--neon-blue); color: #000; box-shadow: var(--border-glow); }
    </style>
</head>
<body>
    <div id="app">
        <div id="sidebar">
            <div class="logo">JARVIS</div>
            <div id="nav-menu"></div>
        </div>
        <div id="main-panel">
            <div id="panel-title" class="panel-header">SISTEMA CENTRAL</div>
            <div class="module-container" id="module-content">
                <div style="display:flex; justify-content:center; align-items:center; height:100%; color: var(--neon-blue);">
                    SISTEMA EN ESPERA... SELECCIONE DIVISIÓN
                </div>
            </div>
        </div>
        <div id="chat-console">
            <div class="panel-header">CONSOLA DIRECTA</div>
            <div id="chat-history"></div>
            <div class="input-area">
                <input type="text" id="user-input" placeholder="Introduzca comando, Señor...">
                <button id="mic-btn">🎤</button>
                <button id="send-btn">➔</button>
            </div>
        </div>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
