<!DOCTYPE html>
<html class="dark" lang="es">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <meta content="web_dashboard" name="shell-type">
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#e3fdff",
            "primary-container": "#00f3ff",
            "primary-fixed": "#6ff6ff",
            "primary-fixed-dim": "#00dce6",
            "secondary": "#b3c5ff",
            "secondary-container": "#0266ff",
            "tertiary": "#fff6fd",
            "tertiary-container": "#f1d1ff",
            "error": "#ffb4ab",
            "surface": "#0f141a",
            "background": "#0f141a",
            "surface-container-lowest": "#0a0e15",
            "surface-container-low": "#181c23",
            "surface-container": "#1c2027",
            "surface-container-high": "#262a31",
            "surface-container-highest": "#31353c",
            "on-surface": "#dfe2ec",
            "on-surface-variant": "#b9cacb",

            "on-primary": "#00373a",
            "on-secondary": "#002b75",
            "on-tertiary": "#4e0078",
            "on-error": "#690005"
          },
          fontFamily: {
            sans: ["Inter", "sans-serif"],
            mono: ["JetBrains Mono", "monospace"],
            display: ["Space Grotesk", "sans-serif"]
          }
        }
      }
    }
  </script>
  <title>JARVIS ECC - Centro de Mando Global</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-background text-on-surface font-sans antialiased">
